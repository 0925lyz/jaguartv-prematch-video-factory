[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jaguartv-prematch-video-factory"
version = "0.1.0"
description = "Auditable JaguarTV pre-match poster and video production pipeline"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jaguartv-prematch = "jaguartv_prematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
